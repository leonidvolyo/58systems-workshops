<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Умный расчёт цены — учебный пример</title><link rel="stylesheet" href="../shared.css?v=6"><link rel="stylesheet" href="quote.css?v=5"><script defer src="quote-pro-core.js"></script><script defer src="quote.js"></script><script>if(self!==top)document.documentElement.classList.add('framed')</script></head>
<body><div class="wrap">
<p class="tag">ТРЕК A · УЧЕБНЫЙ ЭТАЛОН · ВЫМЫШЛЕННЫЕ ДАННЫЕ</p>
<h1>Расчёт стоимости съёмки</h1>
<p>Выберите пакет, поменяйте числа — итог обновится сразу.</p>
<form id="f" class="card" novalidate>
  <div class="pkgs" role="radiogroup" aria-label="Пакет">
    <label class="pkg"><input type="radio" name="pkg" value="basic" checked><span>Базовый</span></label>
    <label class="pkg"><input type="radio" name="pkg" value="standard"><span>Стандарт <small>×1,25</small></span></label>
    <label class="pkg"><input type="radio" name="pkg" value="premium"><span>Премиум <small>×1,6</small></span></label>
  </div>
  <div class="two"><div><label for="hours">Часы</label><input id="hours" type="number" step="any" inputmode="decimal" value="2"></div>
  <div><label for="rate">Ставка в час (€)</label><input id="rate" type="number" step="any" inputmode="decimal" value="60"></div>
  <div><label for="extras">Доп. расходы (€)</label><input id="extras" type="number" step="any" inputmode="decimal" value="20"></div>
  <div><label for="travel">Выезд (€)</label><input id="travel" type="number" step="any" inputmode="decimal" value="0"></div></div>
  <label for="discount">Скидка, фиксированная сумма (€)</label><input id="discount" type="number" step="any" inputmode="decimal" value="0">
  <p id="error" class="error" role="alert" hidden></p>
</form>
<div id="result" class="card result" aria-live="polite">
  <div class="row"><span>Работа</span><b id="labor"></b></div>
  <div class="row"><span>Расходы и выезд</span><b id="adds"></b></div>
  <div class="row"><span>Скидка</span><b id="disc"></b></div>
  <p class="tag l">ИТОГО · <span id="pkgname"></span></p><div class="big" id="total">0</div>
  <div class="btns"><button type="button" id="copy">Скопировать для клиента</button><button type="button" id="print" class="alt">Печать / PDF</button></div>
  <p id="msg" class="note l" role="status"></p>
</div>
<p class="note">Учебный пример, не является счётом, офертой или налоговым расчётом. Работает в браузере, ничего не отправляет и не сохраняет.</p>
</div></body></html>
