<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мини-сайт</title>
<style>
/* ============ ТЕМЫ: меняются одним словом в SITE.theme ============ */
:root,[data-theme=noir]{--bg:#09090b;--s1:#111114;--s2:#18181c;--line:#26262c;--text:#f4f4f1;--mute:#a1a1aa;--dim:#44444c;--acc:#d7ff3f;--ink:#09090b}
[data-theme=paper]{--bg:#f6f2ea;--s1:#ffffff;--s2:#efe9dd;--line:#ddd5c5;--text:#1b1a17;--mute:#625c50;--dim:#c9c0ae;--acc:#ff5a1f;--ink:#ffffff}
[data-theme=rose]{--bg:#150d14;--s1:#1e121d;--s2:#2a1a28;--line:#3a2437;--text:#fbeff4;--mute:#c9a9ba;--dim:#5a3a52;--acc:#ff7ab0;--ink:#190812}
[data-theme=forest]{--bg:#08120d;--s1:#0e1b14;--s2:#15271d;--line:#1f3a2b;--text:#eaf6ee;--mute:#9db8a8;--dim:#2f5240;--acc:#6ee7a8;--ink:#05110a}
[data-theme=sand]{--bg:#efe6d8;--s1:#f8f2e8;--s2:#e6dac6;--line:#d3c4a8;--text:#2a2118;--mute:#6e5f4b;--dim:#c4b498;--acc:#b8532f;--ink:#fff8ee}
[data-theme=paper],[data-theme=sand]{color-scheme:light}html:not([data-theme=paper]):not([data-theme=sand]){color-scheme:dark}
html.framed{scrollbar-width:none}html.framed::-webkit-scrollbar{display:none}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}a{color:inherit}svg{display:block}
.wrap{width:min(1120px,100% - 40px);margin:auto}.narrow{width:min(820px,100% - 40px)}section{padding:clamp(72px,10vw,130px) 0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:16px}.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
h2{font-size:clamp(30px,5.4vw,60px);line-height:1.02;letter-spacing:-.04em;font-weight:780;margin-bottom:clamp(26px,4vw,48px);text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-weight:650;font-size:15px;text-decoration:none;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s}
.btn:hover{border-color:var(--mute)}.btn:active{transform:scale(.98)}.btn.p{background:var(--acc);border-color:var(--acc);color:var(--ink)}.btn.p:hover{box-shadow:0 10px 30px -8px var(--acc)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}.top.s{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:var(--line)}
.top b{font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}.top .btn{min-height:38px;padding:0 16px;font-size:14px;border-radius:11px}.framed .top{padding-top:38px}
.prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);z-index:40}
/* ---- hero ---- */
.hero{min-height:100svh;display:grid;align-items:center;position:relative;overflow:hidden;padding:96px 0 44px}.framed .hero{padding-top:112px}
.hero .wrap{display:grid;gap:10px;align-items:center}@media(min-width:900px){.hero .wrap{grid-template-columns:1.02fr .98fr;gap:20px}}
.mega{font-size:clamp(44px,min(8.8vw,13svh),128px);line-height:.9;letter-spacing:-.05em;font-weight:800;text-transform:uppercase;margin-bottom:22px}
.ln{display:block;overflow:hidden;padding:.07em 0 .03em;margin:-.07em 0 -.03em}.ln>span{display:inline-block;transform:translateY(108%);animation:rise 1.1s cubic-bezier(.22,1,.36,1) forwards}.ln:nth-child(2)>span{animation-delay:.09s}.ln:nth-child(3)>span{animation-delay:.18s}.ln:nth-child(4)>span{animation-delay:.27s}
@keyframes rise{to{transform:none}}
.tag{font-size:clamp(20px,3.6vw,30px);color:var(--mute);font-weight:620;letter-spacing:-.02em;margin-bottom:12px}.about{max-width:44ch;color:var(--mute)}
.tag,.about,.acts,.facts,.eyebrow.h{animation:fadeup .9s cubic-bezier(.22,1,.36,1) both}.tag{animation-delay:.3s}.about{animation-delay:.38s}.acts{animation-delay:.46s}.facts{animation-delay:.56s}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 30px}
.facts{display:flex;border-top:1px solid var(--line);padding-top:20px;max-width:520px}.facts li{flex:1;padding-right:14px}.facts li+li{padding-left:18px;border-left:1px solid var(--line)}.facts b{display:block;font-size:clamp(26px,5vw,38px);letter-spacing:-.04em;line-height:1.05;font-weight:800}.facts span{font-size:13px;color:var(--mute)}
.rstage{position:relative;display:grid;place-items:center;height:clamp(280px,56svh,540px);perspective:1800px;animation:fadeup 1.2s .2s both}.framed .rstage{height:190px;order:-1}.framed .hero{padding-top:104px}.framed .mega{font-size:clamp(40px,14vw,60px);margin-bottom:12px}.framed .tag{font-size:19px}.framed .facts{display:none}
.halo{position:absolute;width:min(560px,100%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 26%,transparent),transparent 62%);filter:blur(8px)}
.ring{--cw:clamp(96px,11vw,162px);--ch:calc(var(--cw)*1.32);--a:0deg;--t:-8deg;position:relative;width:var(--cw);height:var(--ch);transform-style:preserve-3d;transform:rotateX(var(--t)) rotateY(var(--a));will-change:transform}
@media(max-width:899px){.ring{--cw:clamp(84px,22vw,128px)}.framed .ring{--cw:88px}}
.rc{position:absolute;inset:0;transform:rotateY(calc(var(--i)*(360deg/var(--n)))) translateZ(var(--R));backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;border:1px solid color-mix(in srgb,var(--text) 14%,transparent);background:linear-gradient(165deg,var(--s2),var(--s1));box-shadow:0 30px 60px -28px #000c}
.rc .art{position:absolute;inset:0}.rc .art svg{width:100%;height:100%}.rc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rc span{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--bg) 72%,transparent);padding:5px 11px;border-radius:99px;font-size:12px;font-weight:650;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rcap{position:absolute;bottom:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
/* ---- marquee / statement ---- */
.mqw{border-block:1px solid var(--line);overflow:hidden;padding:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq{display:flex;width:max-content;animation:mq 38s linear infinite;padding:16px 0}.mq span{display:flex;align-items:center;gap:44px;padding:0 22px;font-size:13px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.mq span::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc)}@keyframes mq{to{transform:translateX(-50%)}}
.stmt{font-size:clamp(26px,4.6vw,56px);line-height:1.12;font-weight:680;letter-spacing:-.04em}.stmt .w{color:var(--dim);transition:color .35s}.stmt .w.lit{color:var(--text)}.stmt .w.acc.lit{color:var(--acc)}
/* ---- services: pinned scene on desktop, list on phones ---- */
.svc li{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line)}.svc li:first-child{border-top:1px solid var(--line)}
.svc i{font-style:normal;font-size:12px;color:var(--mute);font-weight:650}.svc b{font-size:clamp(19px,5.2vw,28px);letter-spacing:-.025em;font-weight:720}.svc small{display:block;color:var(--mute);font-size:14px;font-weight:400}.svc em{font-style:normal;color:var(--acc);font-weight:760;white-space:nowrap;font-size:clamp(16px,4.4vw,22px)}
.pgrid{display:none}
@media(min-width:900px){
  html:not(.nopin) .pin{height:calc(var(--n)*72svh + 100svh);padding:0}
  html:not(.nopin) .pin .sticky{position:sticky;top:0;height:100svh;display:grid;align-items:center}
  html:not(.nopin) .pin .svc-m{display:none}
  html:not(.nopin) .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,90px);align-items:center}
  .pl li{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);opacity:.38;transition:opacity .4s}.pl li.on{opacity:1}.pl li:first-child{border-top:1px solid var(--line)}
  .pl i{font-style:normal;font-size:13px;font-weight:650;color:var(--mute)}.pl li.on i{color:var(--acc)}.pl b{font-size:clamp(22px,2.6vw,34px);letter-spacing:-.03em;font-weight:740}.pl small{display:block;color:var(--mute);font-size:15px;font-weight:400;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s,opacity .4s}.pl li.on small{max-height:60px;opacity:1}.pl em{font-style:normal;color:var(--acc);font-weight:780;font-size:clamp(18px,2vw,26px);white-space:nowrap}
  .pbar{height:3px;border-radius:3px;background:var(--line);margin-top:26px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);transform-origin:left;transform:scaleX(0)}
  .pcard{position:relative;aspect-ratio:4/5;width:min(440px,100%);justify-self:center;border-radius:30px;border:1px solid var(--line);background:linear-gradient(165deg,var(--s2),var(--s1));overflow:hidden;box-shadow:0 50px 90px -40px #000b}
  .psc{position:absolute;inset:0;opacity:0;transform:scale(.94) translateY(16px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}.psc.on{opacity:1;transform:none}
  .psc .art{position:absolute;inset:6% 8% 22%}.psc .art svg{width:100%;height:100%;overflow:visible}.psc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .psc .pr{position:absolute;left:22px;bottom:20px;right:22px;display:flex;justify-content:space-between;align-items:flex-end}.psc .pr b{font-size:clamp(34px,4vw,54px);letter-spacing:-.045em;color:var(--acc);font-weight:800;line-height:1}.psc .pr span{color:var(--mute);font-size:14px}
}
/* ---- works rail ---- */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 20px 20px;margin:0 -20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.rail::-webkit-scrollbar{display:none}
.shot{flex:0 0 min(66vw,270px);aspect-ratio:3/4;border-radius:22px;scroll-snap-align:start;position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(165deg,var(--s2),var(--s1));transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .6s,border-color .3s}
.shot:hover{border-color:var(--acc)}.shot .art{position:absolute;inset:0}.shot .art svg{width:100%;height:100%}.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot span{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--bg) 72%,transparent);padding:6px 12px;border-radius:99px;font-size:14px;font-weight:650;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.anim .rail .shot{opacity:0;transform:translateX(calc(var(--i)*-72%)) rotate(calc(var(--i)*-5deg)) scale(.92)}.anim .rail.in .shot{opacity:1;transform:none;transition-delay:calc(var(--i)*.08s)}
/* ---- steps, cards, calculator ---- */
.steps{display:grid;gap:14px}@media(min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.st{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:24px}.st b{display:block;font-size:13px;color:var(--acc);letter-spacing:.1em;margin-bottom:14px}.st h3{font-size:20px;letter-spacing:-.02em;margin-bottom:6px}.st p{color:var(--mute);font-size:15px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,4vw,34px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:var(--mute);font-size:13px}
.step{display:inline-flex;align-items:center;gap:4px}.step button{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--s2);color:var(--text);font-size:20px;cursor:pointer;transition:transform .15s,border-color .2s}.step button:active{transform:scale(.92)}.step button:hover{border-color:var(--acc)}.step output{min-width:30px;text-align:center;font-weight:750}
.chk{display:flex;align-items:center;gap:12px;min-height:46px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--acc)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 14px;padding:18px 20px;border-radius:18px;background:color-mix(in srgb,var(--acc) 13%,var(--s2))}.total b{font-size:clamp(32px,9vw,48px);letter-spacing:-.04em;color:var(--acc);font-weight:800}
textarea{width:100%;min-height:52px;border:1px solid var(--line);background:var(--s2);color:var(--text);border-radius:14px;font:inherit;font-size:16px;padding:13px;margin-top:6px}
.err{color:#ff8a98;font-size:14px;min-height:1.4em}.msg{font-size:14px;color:var(--mute);min-height:1.4em}.ch{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
/* ---- quiz ---- */
.qwrap{position:relative;overflow:hidden;min-height:340px}.qbar{display:flex;gap:6px;margin-bottom:26px}.qbar i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}.qbar i::after{content:"";position:absolute;inset:0;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.22,1,.36,1)}.qbar i.on::after{transform:scaleX(1)}
.qslide{animation:slidein .55s cubic-bezier(.22,1,.36,1) both}@keyframes slidein{from{opacity:0;transform:translateX(34px)}}
.qq{font-size:clamp(26px,6.4vw,44px);letter-spacing:-.04em;line-height:1.05;font-weight:780;margin:6px 0 22px}
.qopt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;min-height:60px;padding:14px 16px;margin:10px 0;border:1px solid var(--line);background:var(--s2);color:var(--text);border-radius:16px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;transition:border-color .2s,transform .25s,background .2s}
.qopt:hover{border-color:var(--acc);transform:translateX(4px)}.qopt b{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--mute)}.qopt:hover b{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.qres{display:grid;gap:22px;align-items:center}@media(min-width:640px){.qres{grid-template-columns:1fr 220px}}
.res{font-size:clamp(34px,9vw,58px);font-weight:800;letter-spacing:-.05em;line-height:1;margin:8px 0 10px}
.prev{width:min(220px,60%);justify-self:center;border-radius:18px;border:1px solid var(--line);background:var(--s2);aspect-ratio:9/16;object-fit:cover;box-shadow:0 24px 50px -20px #000a}
/* ---- contact ---- */
.big-mq{overflow:hidden;margin-bottom:34px}.big-mq div{display:flex;width:max-content;animation:mq 30s linear infinite}.big-mq span{font-size:clamp(46px,11vw,150px);font-weight:800;letter-spacing:-.055em;line-height:1;text-transform:uppercase;padding-right:.4em;color:var(--dim)}.big-mq span:nth-child(even){color:var(--acc)}
.tiles{display:grid;gap:12px}@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:22px;border:1px solid var(--line);background:var(--s1);text-decoration:none;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:transform .3s,border-color .3s}.tile:hover{transform:translateY(-4px);border-color:var(--acc)}.tile b{font-size:19px}.tile span{color:var(--mute);font-size:14px}.tile.p{background:var(--acc);border-color:var(--acc);color:var(--ink)}.tile.p span{color:var(--ink);opacity:.75}
.info{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:22px;color:var(--mute);font-size:14px}.info b{color:var(--text);font-weight:650}
footer{padding:40px 20px calc(40px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--mute)}footer a{color:var(--text)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.22,1,.36,1) var(--d,0s),transform .9s cubic-bezier(.22,1,.36,1) var(--d,0s)}.rv.in{opacity:1;transform:none}
html:not(.anim) .rv,html:not(.anim) .ln>span{opacity:1;transform:none;animation:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.ln>span{transform:none}html{scroll-behavior:auto}.anim .rail .shot{opacity:1;transform:none}}
</style></head>

<script id="settings">

<script id="core">
/* ГОТОВАЯ ЛОГИКА (проверена тестами). Не меняйте без необходимости: здесь расчёты, ссылки и безопасность. */
const Core=(function(){
  'use strict';
  const esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  const cents=function(n){return Math.round(Number(n)*100);};
  function qty(v){const n=Number(v);if(!Number.isInteger(n)||n<0||n>99)throw new Error('Количество: целое число от 0 до 99.');return n;}
  function calcTotal(services,addons,sel,addOnIds){
    const lines=[];let subtotal=0;
    (services||[]).forEach(function(s){
      const q=qty((sel||{})[s.id]||0);
      if(q>0){const price=Number(s.price);if(!Number.isFinite(price)||price<0)throw new Error('Цена услуги «'+s.name+'» указана неверно.');const c=cents(price)*q;subtotal+=c;lines.push({id:s.id,name:s.name,qty:q,cents:c});}
    });
    if(!lines.length)throw new Error('Выберите хотя бы одну услугу.');
    let extra=0;const used=[];
    (addons||[]).forEach(function(a){
      if((addOnIds||[]).indexOf(a.id)>-1){
        let c=0;
        if(a.percent!=null){if(!(a.percent>=0&&a.percent<=100))throw new Error('Процент доплаты должен быть от 0 до 100.');c=Math.round(subtotal*a.percent/100);}
        else if(a.fixed!=null){if(!(a.fixed>=0))throw new Error('Доплата указана неверно.');c=cents(a.fixed);}
        extra+=c;used.push({id:a.id,name:a.name,cents:c});
      }
    });
    return {lines:lines,addons:used,subtotalCents:subtotal,extraCents:extra,totalCents:subtotal+extra};
  }
  function money(c,cur){return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2}).format(c/100)+' '+(cur||'€');}
  function buildMessage(calc,cur,note){
    const L=['Здравствуйте! Это запрос с вашего сайта.','Хочу:'];
    calc.lines.forEach(function(l){L.push('— '+l.name+' ×'+l.qty+' — '+money(l.cents,cur));});
    if(calc.addons.length)L.push('Дополнительно: '+calc.addons.map(function(a){return a.name;}).join(', '));
    L.push('Итого: '+money(calc.totalCents,cur));
    if(note)L.push('Пожелания: '+String(note).slice(0,300));
    return L.join('\n');
  }
  function quizMessage(name){return 'Здравствуйте! Прошёл(ла) квиз на вашем сайте — мне подошло: '+name+'. Хочу записаться.';}
  const digits=function(s){return String(s||'').replace(/\D/g,'');};
  function whatsappUrl(num,text){const d=digits(num);if(d.length<8||d.length>15)return '';return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'');}
  function telegramUrl(u){u=String(u||'').replace(/^@/,'');return /^[A-Za-z0-9_]{5,32}$/.test(u)?'https://t.me/'+u:'';}
  function instagramUrl(u){u=String(u||'').replace(/^@/,'');return /^[A-Za-z0-9._]{1,30}$/.test(u)?'https://instagram.com/'+u:'';}
  function mailtoUrl(e,subj,body){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||'')?'mailto:'+e+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body):'';}
  function safeImg(u){u=String(u||'');return /^(https:\/\/\S+|data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+|(?!\/)(?!.*\.\.)[\w\-.\/]+\.(png|jpe?g|webp|avif))$/i.test(u)?u:'';}
  function scoreQuiz(quiz,serviceIds,answers){
    const scores={};serviceIds.forEach(function(id){scores[id]=0;});
    quiz.questions.forEach(function(q,i){
      const a=answers[i];
      if(a===undefined||a===null)throw new Error('Ответьте на все вопросы.');
      if(!Number.isInteger(a)||a<0||a>=q.options.length)throw new Error('Неверный ответ на вопрос.');
      const pts=q.options[a].points||{};
      Object.keys(pts).forEach(function(id){if(!(id in scores))throw new Error('В квизе указана неизвестная услуга: '+id);scores[id]+=pts[id];});
    });
    const ranked=serviceIds.map(function(id,i){return {id:id,s:scores[id],i:i};}).sort(function(a,b){return b.s-a.s||a.i-b.i;});
    return {scores:scores,winnerId:ranked[0].id,tie:ranked.length>1&&ranked[0].s===ranked[1].s};
  }
  return {esc:esc,calcTotal:calcTotal,money:money,buildMessage:buildMessage,quizMessage:quizMessage,whatsappUrl:whatsappUrl,telegramUrl:telegramUrl,instagramUrl:instagramUrl,mailtoUrl:mailtoUrl,safeImg:safeImg,scoreQuiz:scoreQuiz};
})();
if(typeof module!=='undefined'&&module.exports)module.exports=Core;
</script>

  if((S.steps||[]).length)html+=sec('how','Как это работает','Как записаться','<div class="steps">'+S.steps.map(function(s,i){return '<div class="st rv" style="--d:'+(i*.1)+'s"><b>0'+(i+1)+'</b><h3>'+E(s.t)+'</h3><p>'+E(s.d)+'</p></div>';}).join('')+'</div>');
  if(S.calculator&&S.calculator.enabled)html+=sec('calc','Расчёт',S.calculator.title||'Расчёт стоимости','<div class="card"><div id="calcRows">'+S.services.map(function(s){return '<div class="row"><span><b>'+E(s.name)+'</b><small>'+money(s.price)+'</small></span><span class="step"><button type="button" data-d="-1" data-id="'+E(s.id)+'" aria-label="Меньше: '+E(s.name)+'">−</button><output id="q_'+E(s.id)+'">0</output><button type="button" data-d="1" data-id="'+E(s.id)+'" aria-label="Больше: '+E(s.name)+'">+</button></span></div>';}).join('')+(S.addons||[]).map(function(a){return '<label class="chk"><input type="checkbox" data-add="'+E(a.id)+'"> '+E(a.name)+'</label>';}).join('')+'</div><label class="msg" for="note">Пожелания (по желанию)</label><textarea id="note" rows="2" maxlength="300"></textarea><div class="total"><span>Итого</span><b id="sum">0</b></div><p class="err" id="calcErr" role="alert"></p><div class="ch" id="calcCh"></div><p class="msg" id="calcMsg" role="status"></p></div>');
  if(S.quiz&&S.quiz.enabled)html+=sec('quiz','Квиз',S.quiz.title,'<div class="card qwrap" id="quizBox"></div>');
  const tiles=[];
  if(wa(''))tiles.push('<a class="tile p" target="_blank" rel="noopener" href="'+E(wa('Здравствуйте! Хочу записаться.'))+'"><b>WhatsApp</b><span>Ответим быстро</span></a>');
  if(tg)tiles.push('<button class="tile'+(tiles.length?'':' p')+'" type="button" data-tg="c"><b>Telegram</b><span>Скопируем сообщение и откроем чат</span></button>');
  if(ig)tiles.push('<a class="tile" target="_blank" rel="noopener" href="'+E(ig)+'"><b>Instagram</b><span>Работы и новости</span></a>');
  const mm=C.mailtoUrl(ct.email,'Запрос с сайта','Здравствуйте!');if(mm)tiles.push('<a class="tile" href="'+E(mm)+'"><b>Почта</b><span>'+E(ct.email)+'</span></a>');
  const bm='<span>Давайте работать</span><span>Давайте работать</span><span>Давайте работать</span><span>Давайте работать</span>';
  html+='<section id="contact" class="wrap"><div class="big-mq" aria-hidden="true"><div>'+bm+bm+'</div></div><div class="rv"><p class="eyebrow">Контакты</p><div class="tiles">'+(tiles.join('')||'<span class="msg">Добавьте контакты в блок SITE.contact.</span>')+'</div>'+((S.info||[]).length?'<div class="info">'+S.info.map(function(x){return '<span><b>'+E(x.k)+':</b> '+E(x.v)+'</span>';}).join('')+'</div>':'')+'<p class="msg" id="cMsg" role="status"></p></div></section>';
  html+='<footer>© '+E(S.name)+(S.badge?' · <a href="https://workshops.58systems.com" target="_blank" rel="noopener">Сделано на воркшопе 58 Systems</a>':'')+'</footer>';
  document.getElementById('app').innerHTML=html;

  const cm=document.getElementById('cMsg');
  document.querySelectorAll('[data-tg="c"]').forEach(function(b){b.addEventListener('click',function(){copyAndOpen('Здравствуйте! Хочу записаться.',tg,cm);});});

  /* калькулятор */
  if(S.calculator&&S.calculator.enabled){
    const sel={},adds=[],sum=document.getElementById('sum'),err=document.getElementById('calcErr'),ch=document.getElementById('calcCh'),cmsg=document.getElementById('calcMsg');let shown=0,raf=0;
    const anim=function(to){cancelAnimationFrame(raf);if(reduce){shown=to;sum.textContent=C.money(to,cur);return;}const f=shown,t0=performance.now();(function tick(t){const k=Math.min(1,(t-t0)/450);shown=Math.round(f+(to-f)*(1-Math.pow(1-k,3)));sum.textContent=C.money(shown,cur);if(k<1)raf=requestAnimationFrame(tick);})(t0);};
    const render=function(){err.textContent='';cmsg.textContent='';
      try{const r=C.calcTotal(S.services,S.addons,sel,adds);anim(r.totalCents);const msg=C.buildMessage(r,cur,document.getElementById('note').value);ch.innerHTML=channels(msg,'k');ch.querySelectorAll('[data-tg]').forEach(function(b){b.addEventListener('click',function(){copyAndOpen(msg,tg,cmsg);});});}
      catch(e){anim(0);ch.innerHTML='';err.textContent=e.message;}};
    document.getElementById('calc').addEventListener('click',function(e){const b=e.target.closest('button[data-id]');if(!b)return;const id=b.dataset.id;sel[id]=Math.max(0,Math.min(99,(sel[id]||0)+Number(b.dataset.d)));document.getElementById('q_'+id).textContent=sel[id];render();});
    document.getElementById('calc').addEventListener('change',function(e){const a=e.target.dataset&&e.target.dataset.add;if(!a)return;const i=adds.indexOf(a);if(e.target.checked&&i<0)adds.push(a);if(!e.target.checked&&i>-1)adds.splice(i,1);render();});
    document.getElementById('note').addEventListener('input',render);render();
  }

  /* квиз */
  if(S.quiz&&S.quiz.enabled){
    const box=document.getElementById('quizBox'),Q=S.quiz.questions,ids=S.services.map(function(s){return s.id;}),ans=[];let i=0;
    const paint=function(svc,k){
      const c=document.createElement('canvas');c.width=1080*k;c.height=1920*k;const x=c.getContext('2d'),st=getComputedStyle(root),g=function(nm,d){return st.getPropertyValue(nm).trim()||d;};
      const bg=g('--bg','#09090b'),s2=g('--s2','#18181c'),tx=g('--text','#fff'),ac=g('--acc','#d7ff3f'),mu=g('--mute','#aaa');
      x.scale(k,k);const gr=x.createLinearGradient(0,0,1080,1920);gr.addColorStop(0,bg);gr.addColorStop(1,s2);x.fillStyle=gr;x.fillRect(0,0,1080,1920);
      x.globalAlpha=.18;x.fillStyle=ac;x.beginPath();x.arc(900,300,380,0,7);x.fill();x.globalAlpha=1;
      x.textAlign='left';x.fillStyle=ac;x.font='700 46px system-ui,sans-serif';x.fillText('МОЙ РЕЗУЛЬТАТ',90,560);
      x.fillStyle=tx;x.font='800 132px system-ui,sans-serif';let y=720,line='';svc.name.split(' ').forEach(function(w){const t=line?line+' '+w:w;if(x.measureText(t).width>900&&line){x.fillText(line,90,y);line=w;y+=150;}else line=t;});x.fillText(line,90,y);
      x.fillStyle=mu;x.font='48px system-ui,sans-serif';x.fillText(svc.desc,90,y+100);x.fillStyle=tx;x.font='700 52px system-ui,sans-serif';x.fillText(S.name,90,1700);x.fillStyle=mu;x.font='40px system-ui,sans-serif';x.fillText(S.role+(S.city?' · '+S.city:''),90,1760);
      return c;};
    const dots=function(){return '<div class="qbar">'+Q.map(function(_,k){return '<i class="'+(k<=i?'on':'')+'"></i>';}).join('')+'</div>';};
    const show=function(){
      if(i<Q.length){
        box.innerHTML='<div class="qslide">'+dots()+'<p class="eyebrow">Вопрос '+(i+1)+' из '+Q.length+'</p><h3 class="qq">'+E(Q[i].q)+'</h3>'+Q[i].options.map(function(o,k){return '<button type="button" class="qopt" data-k="'+k+'"><b>'+'АБВГДЕ'.charAt(k)+'</b>'+E(o.label)+'</button>';}).join('')+'</div>';
        box.querySelectorAll('.qopt').forEach(function(b){b.addEventListener('click',function(){ans[i]=Number(b.dataset.k);i++;show();});});
      }else{
        try{const r=C.scoreQuiz(S.quiz,ids,ans),svc=S.services.filter(function(s){return s.id===r.winnerId;})[0],m=C.quizMessage(svc.name);
          box.innerHTML='<div class="qslide"><div class="qbar">'+Q.map(function(){return '<i class="on"></i>';}).join('')+'</div><div class="qres"><div><p class="eyebrow">Вам подходит</p><div class="res">'+E(svc.name)+'</div><p style="color:var(--mute)">'+E(svc.desc)+' · '+money(svc.price)+'</p>'+(r.tie?'<p class="msg">Два варианта подошли одинаково — показан первый в списке.</p>':'')+'<div class="ch">'+channels(m,'z')+'</div><div class="ch"><button class="btn" type="button" id="qcard">Скачать карточку для Stories</button><button class="btn" type="button" id="qagain">Пройти заново</button></div><p class="msg" id="qMsg" role="status"></p></div><img class="prev" alt="Карточка для Stories" id="qprev"></div></div>';
          document.getElementById('qprev').src=paint(svc,.3).toDataURL('image/png');const qm=document.getElementById('qMsg');
          box.querySelectorAll('[data-tg]').forEach(function(b){b.addEventListener('click',function(){copyAndOpen(m,tg,qm);});});
          document.getElementById('qcard').addEventListener('click',function(){const a=document.createElement('a');a.download='moi-rezultat.png';a.href=paint(svc,1).toDataURL('image/png');a.click();});
          document.getElementById('qagain').addEventListener('click',function(){i=0;ans.length=0;show();});
        }catch(e){box.innerHTML='<p class="err">'+E(e.message)+'</p>';}}};
    show();
  }

  /* ---- анимации ---- */
  const top=document.getElementById('top'),bar=document.getElementById('prog'),ring=document.getElementById('ring'),hero=document.getElementById('hero');
  const pars=[].slice.call(document.querySelectorAll('[data-par]'));
  let words=[];const stmt=document.getElementById('stmt');
  if(stmt){const tx=stmt.textContent.trim().split(/\s+/);stmt.textContent='';tx.forEach(function(w,i){const s=document.createElement('span');s.className='w'+(i>=tx.length-3?' acc':'');s.textContent=w+(i<tx.length-1?' ':'');stmt.appendChild(s);words.push(s);});if(!root.classList.contains('anim'))words.forEach(function(s){s.classList.add('lit');});}
  const pin=document.getElementById('services'),pl=[].slice.call(document.querySelectorAll('#pl li')),pcs=[].slice.call(document.querySelectorAll('#pcard .psc')),pbar=document.getElementById('pbar');
  const setPin=function(){root.classList.toggle('nopin',!(wide.matches&&fine&&root.classList.contains('anim')));};setPin();addEventListener('resize',setPin);
  let act=-1;const setAct=function(i){if(i===act)return;act=i;pl.forEach(function(li,k){li.classList.toggle('on',k===i);});pcs.forEach(function(p,k){p.classList.toggle('on',k===i);});};
  /* кольцо */
  let R=0,ringA=0,pxn=0,pyn=0,vis=true;
  const sizeRing=function(){if(!ring)return;const cw=ring.offsetWidth,nn=ring.children.length;R=Math.round((cw/2)/Math.tan(Math.PI/nn)+14);ring.style.setProperty('--R',R+'px');};sizeRing();addEventListener('resize',sizeRing);
  if(hasIO&&hero)new IntersectionObserver(function(es){vis=es[0].isIntersecting;}).observe(hero);
  if(fine&&!reduce)addEventListener('pointermove',function(e){pxn=e.clientX/innerWidth-.5;pyn=e.clientY/innerHeight-.5;},{passive:true});
  let last=0;const loop=function(t){
    if(vis&&ring&&!reduce){const dt=Math.min(.05,(t-last)/1000||0);last=t;ringA+=dt*9;ring.style.setProperty('--a',(ringA+scrollY*.16+pxn*34).toFixed(2)+'deg');ring.style.setProperty('--t',(-8+pyn*-8).toFixed(2)+'deg');}
    requestAnimationFrame(loop);};
  if(!reduce)requestAnimationFrame(loop);
  let tk=false;
  const upd=function(){
    tk=false;top.classList.toggle('s',scrollY>24);const h=root.scrollHeight-innerHeight;bar.style.transform='scaleX('+(h>0?Math.min(1,scrollY/h):0)+')';
    const vh=innerHeight;
    if(!reduce)pars.forEach(function(el){const r=el.getBoundingClientRect();if(r.bottom<-80||r.top>vh+80)return;el.style.transform='translate3d(0,'+((r.top+r.height/2-vh/2)*Number(el.dataset.par)).toFixed(1)+'px,0)';});
    if(stmt&&root.classList.contains('anim')){const r=stmt.getBoundingClientRect(),p=Math.max(0,Math.min(1,(vh*.82-r.top)/(r.height+vh*.28))),k=Math.round(p*words.length);for(let i=0;i<words.length;i++)words[i].classList.toggle('lit',i<k);}
    if(pin&&!root.classList.contains('nopin')){const r=pin.getBoundingClientRect(),p=Math.max(0,Math.min(1,-r.top/(r.height-vh)));setAct(Math.min(n-1,Math.floor(p*n)));if(pbar)pbar.style.transform='scaleX('+p+')';}
  };
  addEventListener('scroll',function(){if(!tk){tk=true;requestAnimationFrame(upd);}},{passive:true});addEventListener('resize',upd);upd();
  const count=function(el){const to=+el.dataset.to;if(reduce){el.textContent=to;return;}const t0=performance.now();(function f(nw){const k=Math.min(1,(nw-t0)/1400);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);})(t0);};
  document.querySelectorAll('.facts [data-to]').forEach(function(e){if(reduce||!hasIO)e.textContent=e.dataset.to;else setTimeout(function(){count(e);},700);});
  const els=document.querySelectorAll('.rv,.rail');
  if(root.classList.contains('anim')){const io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.15,rootMargin:'0px 0px -5% 0px'});els.forEach(function(s){io.observe(s);});}
  else els.forEach(function(s){s.classList.add('in');});


  /* ---- Pro-пакет (включается SITE.pro = true): плавный скролл + заголовки по буквам + магнитные кнопки ---- */
  if(S.pro&&!reduce&&!root.classList.contains('framed')){
    const LIBS=[['https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js','sha384-XmJ9SoHtVOHoQUcKvFAzVXwdkKo1Ie3bhmSoIAkcdsHGaIrVJIkmozyq0FJeb/Ly'],['https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js','sha384-wl5TeDVvOWt30Pbf8aSo2ZrzsOjddu3avOBvHe+p+OhJt9gP6w9YXmDkN5DK2/dF'],['https://cdn.jsdelivr.net/npm/lenis@1.3.27/dist/lenis.min.js','sha384-R18XzqnxvVLEF+BYfhpmDx30v7eP83fAckyfoRzK7/Uf6nGqufcmsk0eAKo7S3RU']];
    const load=function(l){return new Promise(function(ok,no){const s=document.createElement('script');s.src=l[0];s.integrity=l[1];s.crossOrigin='anonymous';s.onload=ok;s.onerror=no;document.head.appendChild(s);});};
    LIBS.reduce(function(p,l){return p.then(function(){return load(l);});},Promise.resolve()).then(function(){
      const g=window.gsap,ST=window.ScrollTrigger,Ln=window.Lenis;if(!g||!ST||!Ln)return;
      g.registerPlugin(ST);root.style.scrollBehavior='auto';
      const ls=new Ln({duration:1.1});ls.on('scroll',ST.update);g.ticker.add(function(t){ls.raf(t*1000);});g.ticker.lagSmoothing(0);
      document.querySelectorAll('h2').forEach(function(h){
        const tx=h.textContent.trim();h.setAttribute('aria-label',tx);h.textContent='';
        tx.split(' ').forEach(function(w,i,a){const sw=document.createElement('span');sw.setAttribute('aria-hidden','true');sw.style.cssText='display:inline-block;overflow:hidden;vertical-align:top;padding:.05em 0 .12em;margin:-.05em 0 -.12em';Array.prototype.forEach.call(w,function(ch){const c=document.createElement('span');c.className='pc';c.style.display='inline-block';c.textContent=ch;sw.appendChild(c);});h.appendChild(sw);if(i<a.length-1)h.appendChild(document.createTextNode(' '));});
        g.from(h.querySelectorAll('.pc'),{yPercent:118,duration:1,ease:'power4.out',stagger:.016,scrollTrigger:{trigger:h,start:'top 90%',once:true}});
      });
      if(fine)document.querySelectorAll('.btn.p,.tile.p').forEach(function(b){const xt=g.quickTo(b,'x',{duration:.5,ease:'power3'}),yt=g.quickTo(b,'y',{duration:.5,ease:'power3'});b.addEventListener('pointermove',function(e){const r=b.getBoundingClientRect();xt((e.clientX-r.left-r.width/2)*.25);yt((e.clientY-r.top-r.height/2)*.35);});b.addEventListener('pointerleave',function(){xt(0);yt(0);});});
    }).catch(function(){});
  }

  /* демо-режим ?auto=1 — страница сама медленно прокручивается (для витрины на лендинге); любое касание останавливает */
  if(/[?&]auto=1/.test(location.search)&&!reduce){
    let stop=false,t0=null;['wheel','touchstart','pointerdown','keydown'].forEach(function(ev){addEventListener(ev,function(){stop=true;},{passive:true,once:true});});
    const lp=function(t){if(stop)return;if(t0===null)t0=t;const max=root.scrollHeight-innerHeight,dur=Math.max(14000,max*22),p=((t-t0)%(dur*2))/dur,k=p<1?p:2-p,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;scrollTo({top:Math.round(e*max),behavior:'instant'});requestAnimationFrame(lp);};
    setTimeout(function(){requestAnimationFrame(lp);},2200);
  }
})();
</script>
</body></html>
